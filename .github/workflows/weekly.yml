name: Weekly job radar

on:
  schedule:
    # Mondays at 08:00 UTC. GitHub queues cron runs on shared infrastructure,
    # so the actual start can drift by several minutes.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      skip_issue:
        description: "Skip opening the match issue"
        type: boolean
        default: false

permissions:
  contents: write   # commit the refreshed dataset
  issues: write     # open the weekly match digest

concurrency:
  group: weekly-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The pipeline is intentionally dependency-free, so there is no
      # install step and nothing to pin or audit.
      - name: Collect job boards
        run: python src/collect.py

      - name: Build report and charts
        run: python src/report.py

      - name: Score against profile
        run: python src/match.py

      - name: Commit dataset
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs README.md
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "data: weekly snapshot $(date -u +%Y-W%V)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open match issue
        if: ${{ inputs.skip_issue != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Job matches — week $(date -u +%Y-W%V)" \
            --body-file data/matches.md \
            --label "job-matches" \
            || gh issue create \
                 --title "Job matches — week $(date -u +%Y-W%V)" \
                 --body-file data/matches.md

      - name: Summary
        run: |
          {
            echo "### Weekly radar"
            python -c "import json;s=json.load(open('data/summary.json'));print(f\"- **{s['total_jobs']:,}** roles across **{s['companies']}** companies\n- {s['failed_boards']} board(s) unreachable\n- Remote share: {s['remote_share']:.1%}\")"
          } >> "$GITHUB_STEP_SUMMARY"
