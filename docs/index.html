<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Job Radar</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --fg:#1f2328; --muted:#636c76;
    --accent:#0969da; --chip:#eaeef2; --good:#1a7f37;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--muted:#8b949e;
          --accent:#58a6ff;--chip:#21262d;--good:#3fb950;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 26px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:30px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .stat b{display:block;font-size:23px;line-height:1.2}
  .stat span{color:var(--muted);font-size:12.5px}
  h2{font-size:17px;margin:32px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .bars{display:grid;gap:7px}
  .bar{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:10px;font-size:13px}
  .track{background:var(--chip);border-radius:4px;height:17px;overflow:hidden}
  .fill{height:100%;background:var(--accent);border-radius:4px}
  .bar em{color:var(--muted);font-style:normal;text-align:right;font-size:12px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .controls input,.controls select{background:var(--panel);color:var(--fg);
    border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13.5px}
  .controls input{flex:1;min-width:200px}
  ul.jobs{list-style:none;padding:0;margin:0;display:grid;gap:9px}
  .job{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .job a{color:var(--accent);text-decoration:none;font-weight:600}
  .job a:hover{text-decoration:underline}
  .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
  .pay{color:var(--good);font-weight:600}
  .tags{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
  .tag{background:var(--chip);border-radius:11px;padding:2px 9px;font-size:11.5px;color:var(--muted)}
  footer{margin-top:44px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Job Radar</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="stats" id="stats"></div>

  <h2>Most-requested skills in engineering roles</h2>
  <div class="bars" id="skills"></div>

  <h2>Recent engineering openings</h2>
  <div class="controls">
    <input id="q" placeholder="Filter by title, company, skill or location…">
    <select id="fam">
      <option value="">All functions</option>
      <option value="ml-ai">ML / AI</option>
      <option value="research">Research</option>
      <option value="swe">Software</option>
      <option value="infra">Infrastructure</option>
      <option value="data">Data</option>
    </select>
    <select id="rem">
      <option value="">Anywhere</option>
      <option value="1">Remote only</option>
    </select>
  </div>
  <ul class="jobs" id="jobs"></ul>

  <footer>
    Built from public Greenhouse, Lever and Ashby job-board APIs. Updated weekly.
    <a href="https://github.com/sarajmcghee/ai-job-radar">Source and dataset on GitHub</a>.
  </footer>
</div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "$" + Math.round(n/1000) + "K";
let DATA = null;

fetch("data.json").then(r => r.json()).then(d => { DATA = d; render(d); })
  .catch(() => document.getElementById("sub").textContent = "Could not load data.json.");

function render(d){
  const s = d.summary;
  document.getElementById("sub").textContent =
    `Week ${s.week} · ${s.companies} companies tracked · generated ${s.generated_at.slice(0,10)}`;

  const tech = ["research","ml-ai","data","infra","swe"].reduce((a,f)=>a+(s.by_family[f]||0),0);
  document.getElementById("stats").innerHTML = [
    [s.total_jobs.toLocaleString(), "open roles"],
    [tech.toLocaleString(), "engineering roles"],
    [(s.remote_share*100).toFixed(0)+"%", "remote-friendly"],
    [s.median_salary_midpoint ? money(s.median_salary_midpoint) : "—", "median posted midpoint"],
  ].map(([v,l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");

  // Skill shares are computed over engineering postings in the recent sample,
  // matching how the README frames them.
  const counts = {};
  d.recent.forEach(j => j.s.forEach(k => counts[k] = (counts[k]||0)+1));
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const max = top.length ? top[0][1] : 1;
  document.getElementById("skills").innerHTML = top.map(([k,v]) =>
    `<div class="bar"><span>${esc(k)}</span>
       <div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div>
       <em>${(v/d.recent.length*100).toFixed(0)}%</em></div>`).join("");

  ["q","fam","rem"].forEach(id =>
    document.getElementById(id).addEventListener("input", drawJobs));
  drawJobs();
}

function drawJobs(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  const fam = document.getElementById("fam").value;
  const rem = document.getElementById("rem").value;

  const rows = DATA.recent.filter(j => {
    if (fam && j.f !== fam) return false;
    if (rem && !j.r) return false;
    if (!q) return true;
    return (j.t+" "+j.c+" "+j.l+" "+j.s.join(" ")).toLowerCase().includes(q);
  }).slice(0, 150);

  document.getElementById("jobs").innerHTML = rows.length ? rows.map(j => `
    <li class="job">
      <a href="${esc(j.u)}" target="_blank" rel="noopener noreferrer">${esc(j.t)}</a>
      <div class="meta">${esc(j.c)} · ${esc(j.r ? "Remote" : (j.l || "—"))} · ${esc(j.d)}
        ${j.p ? ` · <span class="pay">${money(j.p[0])}–${money(j.p[1])}</span>` : ""}</div>
      <div class="tags">${j.s.map(k => `<span class="tag">${esc(k)}</span>`).join("")}</div>
    </li>`).join("") : `<li class="job">No roles match that filter.</li>`;
}
</script>
</body>
</html>
